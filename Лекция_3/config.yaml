# Server-owned settings. The public web interface cannot write this file.
# Темы по умолчанию: английская для Europe PMC и OpenAlex, русская для каталога КР.
topics:
  - "diabetes"
  - "сахарный диабет"

# Три источника по умолчанию: литература (Europe PMC + OpenAlex) и каталог КР.
# Остальные адаптеры доступны в интерфейсе и MCP.
sources:
  - "europepmc"
  - "openalex"
  - "minzdrav"

openalex:
  mailto: ""  # Or OPENALEX_MAILTO in the server environment.
  api_key: ""  # Prefer OPENALEX_API_KEY; never commit a real key.
europepmc:
  email: ""  # Optional EUROPEPMC_EMAIL.

minzdrav:
  # auto: official API first; a visible warning accompanies mirror fallback.
  # official: no fallback. mirror: explicitly use third-party metadata only.
  mode: auto
  base_url: "https://minzdrav.clinirec.ru"
  cache_ttl_seconds: 900
  # Алиасы расширяют лексический поиск карточек КР: слова и коды МКБ-10,
  # которых может не быть в заголовке темы (ловит «СД 2 типа» по коду E11).
  # Лексическое совпадение не проверяет клиническую релевантность.
  topic_aliases:
    "сахарный диабет": ["диабет", "E10", "E11", "E12", "E13", "E14"]

summarizer: sumy
providers:
  ollama:
    base_url: "http://localhost:11434/v1"
    model: "qwen2.5:7b"
    # Only this server-owned preset may access the server's local Ollama.
    # In a cloud deployment localhost is NOT the user's computer.
    allow_private: true
  openai:
    base_url: "https://api.openai.com/v1"
    model: "gpt-4o-mini"
    api_key_env: "OPENAI_API_KEY"
    allow_private: false

ui:
  # Public default: no anonymous access to a paid/server-local LLM.
  # Enable only behind authentication/rate limiting or in a trusted local demo.
  enable_llm: false

check_interval_seconds: 3600
send_email: false
email:
  smtp_server: "smtp.gmail.com"
  smtp_port: 587
  username: ""
  password_env: "SMTP_PASSWORD"
  from_address: ""
  to_address: ""
history_size: 1000
