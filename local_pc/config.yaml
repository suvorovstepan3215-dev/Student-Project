# Настройки этой копии приложения. Файл читает только само приложение:
# веб-гость и MCP-клиент не могут его изменить. Секретов здесь нет и быть не должно.

# Темы по умолчанию: английская для Europe PMC и OpenAlex, русская для каталога КР.
topics:
  - "diabetes"
  - "сахарный диабет"

# Три источника по умолчанию: литература (Europe PMC + OpenAlex) и каталог КР.
# Остальные адаптеры доступны в интерфейсе и MCP.
sources:
  - "europepmc"
  - "openalex"
  - "minzdrav"

openalex:
  mailto: ""   # Необязательно; можно задать OPENALEX_MAILTO в окружении.
  api_key: ""  # Лучше через OPENALEX_API_KEY, не храните ключ в файле.
europepmc:
  email: ""    # Необязательно; можно задать EUROPEPMC_EMAIL.
  # ЭКСПЕРИМЕНТ, по умолчанию выключено. Если у open-access записи пустая
  # аннотация, догрузить <abstract> из открытого полного текста (fullTextXML,
  # JATS). Включить: fulltext_abstract_fallback: true или EUROPEPMC_FULLTEXT_FALLBACK=1.
  # Догруженная аннотация помечается abstract_origin=fulltext_xml.
  fulltext_abstract_fallback: false

minzdrav:
  # auto: сначала официальный API, при сбое — зеркало с видимым предупреждением.
  # official: без запасного варианта. mirror: только сторонние метаданные.
  mode: auto
  base_url: "https://minzdrav.clinirec.ru"
  cache_ttl_seconds: 900
  # Алиасы расширяют лексический поиск карточек КР: слова и коды МКБ-10,
  # которых может не быть в заголовке темы (ловит «СД 2 типа» по коду E11).
  # Лексическое совпадение не проверяет клиническую релевантность.
  topic_aliases:
    "сахарный диабет": ["диабет", "E10", "E11", "E12", "E13", "E14"]

# Локальное экстрактивное резюме (Sumy LSA). Работает без интернета и без ключей.
summarizer: sumy

# Серверные пресеты LLM. В этой копии LLM выключена (ui.enable_llm: false),
# поэтому пресеты никуда не отправляются.
providers:
  ollama:
    base_url: "http://localhost:11434/v1"
    model: "qwen2.5:7b"
    allow_private: true
  openai:
    base_url: "https://api.openai.com/v1"
    model: "gpt-4o-mini"
    api_key_env: "OPENAI_API_KEY"
    allow_private: false

ui:
  # Публичный веб-интерфейс не должен давать анонимный доступ к платной LLM.
  enable_llm: false
